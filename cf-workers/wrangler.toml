name = "wecom-komari-cf"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ⚠️ 切勿在 [vars] 中填写真实密钥（此文件会提交到仓库）！
# 敏感配置请使用 wrangler secret 注入（部署前执行一次即可）：
#
#   npx wrangler secret put KOMARI_URL
#   npx wrangler secret put KOMARI_API_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   npx wrangler secret put TELEGRAM_ALLOWED_USERS
#
# 非敏感配置（可留在此处按需修改）：
[vars]
SENDKEY = "set_a_sendkey"
